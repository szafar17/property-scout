# Continuous integration: run the offline test suite + a mock smoke run + lint
# on every pull request and on pushes to main. This is separate from daily.yml
# (the scheduled production pipeline) and needs no secrets/network.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an in-flight run when a branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (runtime + dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests (offline, no creds)
        run: pytest -q

      - name: Mock pipeline smoke run
        run: python -m property_scout.run --sources mock --dry-run --no-enrich

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Type check (mypy)
        run: mypy src
