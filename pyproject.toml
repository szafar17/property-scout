[project]
name = "property-scout"
version = "0.1.0"
description = "Daily real-estate deal-flow pipeline for a licensed NJ agent (Bergen/Passaic/Hudson)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sahil Zafar" }]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "python-dateutil>=2.9",
    "anthropic>=0.34",
    "structlog>=24.1",
    "pandas>=2.2",
    "usaddress>=0.5.10",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = [
    "mcp>=2.0",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
]

[project.scripts]
property-scout = "property_scout.run:main"
property-scout-check = "property_scout.cli:main"
property-scout-export = "property_scout.export_map:main"
property-scout-mcp = "property_scout.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/property_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# (str, Enum) is deliberate: member values flow into Notion selects verbatim.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
